const labels = {ro:{address:"Adresă",phone:"Telefon"},en:{address:"Address",phone:"Phone"}};

function setLanguage(lang){
  if(!translations[lang]) lang="ro";
  document.documentElement.lang=lang;
  document.title=translations[lang].title;
  document.querySelectorAll("[data-key]").forEach(el=>{
    const key=el.dataset.key;
    if(translations[lang][key]!==undefined) el.textContent=translations[lang][key];
  });
  document.querySelectorAll("[data-label]").forEach(el=>{
    el.textContent=labels[lang][el.dataset.label]||el.dataset.label;
  });
  document.getElementById("roBtn").className="btn "+(lang==="ro"?"btn-info text-white":"btn-outline-secondary");
  document.getElementById("enBtn").className="btn "+(lang==="en"?"btn-info text-white":"btn-outline-secondary");
  const url=new URL(window.location.href);
  url.searchParams.set("lang",lang);
  history.replaceState({}, "", url);
}
document.getElementById("year").textContent=new Date().getFullYear();
document.getElementById("roBtn").onclick=e=>{e.preventDefault();setLanguage("ro")};
document.getElementById("enBtn").onclick=e=>{e.preventDefault();setLanguage("en")};
